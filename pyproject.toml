[project]
name = "invoice-api"
version = "0.1.0"
description = "Invoice API"
readme = "README.md"
authors = [
    { name = "Rubén Prikhodtchenko Shumilo", email = "rubenps2409@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "invoice_api.main:app"
