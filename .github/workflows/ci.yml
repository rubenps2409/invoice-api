name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an unfinished run of it pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: invoice
          # A throwaway database that only this job can reach: not a real credential.
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: invoice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoice -d invoice_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The tests use the database named invoice_test on this server.
      DATABASE_URL: postgresql+psycopg://invoice:ci-only-password@127.0.0.1:5432/invoice_test

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true

      - name: Install the locked dependencies
        run: uv sync --frozen

      - name: Generate a secret key for this run
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Ruff (lint)
        run: uv run --no-sync ruff check .

      - name: Ruff (format)
        run: uv run --no-sync ruff format --check .

      - name: Migrations apply and match the models
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic check

      - name: Tests
        run: uv run --no-sync pytest -q

  docker:
    name: Docker stack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Create a .env for Compose
        run: |
          {
            echo "POSTGRES_USER=invoice"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_DB=invoice_db"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "DATABASE_URL=replaced-by-compose"
          } > .env

      - name: Build and start the API and the database
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: The API answers and the database is reachable
        run: curl --fail --silent --show-error http://127.0.0.1:8000/api/health

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down --volumes
